name: TT-Demo Ressourcenpilot (temporärer Abnahmevorschlag)

# Ausschließlich auf dem eigenen temporären Runtimebranch. NIEMALS nach Main,
# Release, PR379 oder in den Candidate-bca übernehmen. Noch kein Dispatch-Go.
"on":
  workflow_dispatch:
    inputs:
      confirmed_workflow_sha:
        description: Separat koordiniert freigegebener vollständiger SHA dieses Runner-/Workflowvorschlags.
        required: true
        type: string

permissions: {}
concurrency:
  group: tt-demo-runtime-budget-only
  cancel-in-progress: false

jobs:
  resources:
    if: >-
      github.repository == 'flowzer-io/flowzer-bpmn-core-engine' &&
      github.ref == 'refs/heads/codex/flowzer-runtime-pilot-diagnostics' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      inputs.confirmed_workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Genau bestätigten Runner-/Workflowstand auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: workflow
          fetch-depth: 0
          persist-credentials: false
      - name: Unveränderliche bereits geprüfte Publisherquelle auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bcaeef6438a4befbc3832d260883f3fd55ce6d8e
          path: publisher
          persist-credentials: false
      - name: Node 22 für gepinntes Playwright bereitstellen
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Einmalige isolierte Ressourcen-/Authabnahme und eigenen Besitz schließen
        timeout-minutes: 50
        env:
          CONFIRMED_WORKFLOW_SHA: ${{ inputs.confirmed_workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        # exec erhält den Abbruch beim eigenen Runner; keine realen Secret- oder Deployinputs.
        run: exec python3 workflow/scripts/demo-runtime/runner.py --source workflow --publisher publisher
      - name: Ausschließlich geschlossenen Zahlen-/Quellenbeleg sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tt-demo-runtime-numbers
          path: ${{ runner.temp }}/flowzer-runtime-${{ github.run_id }}-a1/report/resource-result.json
          if-no-files-found: warn
          retention-days: 30
