name: TT-Demo Candidate (source proposal only)

# TEMPORÄR ausschließlich auf codex/flowzer-demo-candidate. NIEMALS nach Main/
# Release oder PR379 übernehmen: deren vollständiger CI-Vertrag bleibt unverändert.
# Die bereits auf Main registrierte ci.yml kann ausdrücklich mit diesem Ref
# gestartet werden; kein Push/PR startet Publikation oder bestehende Deployments.
"on":
  workflow_dispatch:
    inputs:
      confirmed_workflow_sha:
        description: Separat koordiniert freigegebener vollständiger SHA dieses Candidate-Vorschlags.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tt-demo-candidate-only
  cancel-in-progress: false

env:
  CONFIRMED_WORKFLOW_SHA: ${{ inputs.confirmed_workflow_sha }}
  SOURCE_SHA: cf082ccd9a165429774de9aab907d3583832279c

jobs:
  proof:
    if: >-
      github.repository == 'flowzer-io/flowzer-bpmn-core-engine' &&
      github.ref == 'refs/heads/codex/flowzer-demo-candidate' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      inputs.confirmed_workflow_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Freigegebenen Vorschlag auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Exakte getestete Produktquelle auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: product
          persist-credentials: false
      - name: Original-CI, Quelltree und Testartefakt frisch attestieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 candidate/scripts/demo-candidate/verify.py proof --product product --plan source-proof.json
      - name: Nicht geheimen Quellenbeleg sichern
        uses: actions/upload-artifact@v4
        with:
          name: tt-demo-source-proof
          path: source-proof.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: proof
    # Nicht nur der erste Job: failed-only-Reruns dürfen keinen bereits bestehenden
    # Run-Tag umhängen. Für jede neue Publikation ist ein neuer bestätigter Run nötig.
    if: >-
      github.repository == 'flowzer-io/flowzer-bpmn-core-engine' &&
      github.ref == 'refs/heads/codex/flowzer-demo-candidate' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      inputs.confirmed_workflow_sha == github.sha
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - image: console
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - image: api
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: console
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Freigegebenen Vorschlag auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Exakte Produktquelle auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: product
          persist-credentials: false
      - name: Beleg desselben Laufs laden
        uses: actions/download-artifact@v4
        with:
          name: tt-demo-source-proof
          path: proof
      - name: Bindung vor Registrylogin prüfen
        run: python3 candidate/scripts/demo-candidate/verify.py check-plan --product product --plan proof/source-proof.json
      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3
      - name: Nur für getrennte Demo-Pakete bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Produktimage ausschließlich als Demo-Paketdigest veröffentlichen
        id: image
        uses: docker/build-push-action@v6
        with:
          context: product
          file: product/Dockerfile.${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/flowzer-io/flowzer-bpmn-core-engine
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          outputs: type=image,name=ghcr.io/flowzer-io/flowzer-tt-demo-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: OCI-Digest an Quelle und Aufruf binden
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: >-
          python3 candidate/scripts/demo-candidate/verify.py receipt --product product
          --plan proof/source-proof.json --image ${{ matrix.image }}
          --platform ${{ matrix.platform }} --output receipt.json
      - name: Nicht geheimen Digestbeleg sichern
        uses: actions/upload-artifact@v4
        with:
          name: tt-demo-digest-${{ matrix.image }}-${{ matrix.arch }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 30

  manifest:
    needs: [proof, build]
    if: >-
      github.repository == 'flowzer-io/flowzer-bpmn-core-engine' &&
      github.ref == 'refs/heads/codex/flowzer-demo-candidate' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      inputs.confirmed_workflow_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, console]
    steps:
      - name: Freigegebenen Vorschlag auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Digestbelege desselben Laufs laden
        uses: actions/download-artifact@v4
        with:
          pattern: tt-demo-digest-${{ matrix.image }}-*
          path: receipts
      - name: Manifestargumente geschlossen prüfen
        env:
          CANDIDATE_IMAGE: ${{ matrix.image }}
        run: python3 candidate/scripts/demo-candidate/manifest.py arguments --receipts receipts --output arguments.json
      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3
      - name: Nur für getrennte Demo-Pakete bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Eindeutigen Demo-Run-Tag und endgültigen Digest sichern
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 candidate/scripts/demo-candidate/manifest.py publish --arguments arguments.json --output manifest-receipt.json
      - name: Endgültigen Quellen- und Digestbeleg sichern
        uses: actions/upload-artifact@v4
        with:
          name: tt-demo-manifest-${{ matrix.image }}
          path: manifest-receipt.json
          if-no-files-found: error
          retention-days: 30
