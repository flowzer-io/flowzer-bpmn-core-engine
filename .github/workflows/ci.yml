# TEMPORÄRE DIAGNOSEDEFINITION NUR AUF DIESEM WEGWERFBRANCH. NICHT NACH MAIN/RELEASE MERGEN.
# Der bestehende registrierte ci.yml-Dispatchpfad wird am expliziten Feature-Ref verwendet;
# kein neuer unregistrierter Dispatch und kein Pflicht-CI-/Staging-/Deploylauf.
name: Registrydiagnose — kein Pflicht-CI-Nachweis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowzer-registry-readonly-diagnosis
  cancel-in-progress: false

jobs:
  registry_readonly:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/flowzer-registry-diagnosis'
    name: Nur öffentliche Registry-Metadaten
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Exakten Diagnosequellstand ohne persistierte Credentials auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Feste lokale Caches und öffentliche Tokenhost-Metadaten prüfen
        run: bash scripts/diagnostics/registry-readonly.sh
