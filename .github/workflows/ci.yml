name: CI

on:
  pull_request:
    branches:
      - main
      - release
  push:
    branches:
      - main
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Opt-in vorab in den Node-24-Runtimepfad für JavaScript-basierte GitHub Actions,
  # damit die CI nicht erst kurz vor der Abschaltung von Node 20 überrascht wird.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # webpack-dev-server 6 verlangt Node >= 22.15; mit Node 20 laeuft nur der Build,
  # nicht der Entwicklungsserver.
  NODE_VERSION: '22'

jobs:
  dotnet:
    name: Restore, Build und Tests (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET-SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Kein zusaetzlicher apt-get-Schritt fuer ClearScript/V8 noetig: Microsoft.ClearScript.
      # V8.Native.linux-x64 (siehe src/WebApiEngine.Tests, src/core-engine-tests) verlangt laut
      # readelf -d nur libc.so.6, libdl.so.2, libm.so.6, libpthread.so.0, librt.so.1 und
      # ld-linux-x86-64.so.2 — alles Teil des glibc-Basissystems, das auf ubuntu-latest bereits
      # vorhanden ist. Weder libicu (ICU-Daten liefert Microsoft.ClearScript.V8.ICUData als
      # verwaltetes Paket mit) noch libatomic werden dynamisch nachgeladen.
      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore core-engine.sln

      - name: Testzweck-Kommentare prüfen
        run: python3 scripts/ci/check_test_purpose_comments.py

      - name: Solution bauen
        run: dotnet build core-engine.sln --no-restore --configuration Release

      - name: Tests mit Coverage ausführen
        run: |
          dotnet test src/core-engine-tests/core-engine-tests.csproj \
            --no-restore \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=core-engine-tests.trx" \
            --results-directory ./TestResults/ci

      - name: Web-API-Tests ausführen
        run: |
          dotnet test src/WebApiEngine.Tests/WebApiEngine.Tests.csproj \
            --no-restore \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=webapi-tests.trx" \
            --results-directory ./TestResults/ci

      - name: DMN-Tests ausführen
        run: |
          dotnet test src/FlowzerDmn.Tests/FlowzerDmn.Tests.csproj \
            --no-restore \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=dmn-tests.trx" \
            --results-directory ./TestResults/ci

      - name: Coverage-Kennzahlen extrahieren
        id: coverage
        run: |
          python3 <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          matches = glob.glob('TestResults/ci/**/coverage.cobertura.xml', recursive=True)
          if not matches:
              raise SystemExit('Keine coverage.cobertura.xml gefunden.')

          report = matches[0]
          root = ET.parse(report).getroot()
          line_rate = float(root.attrib.get('line-rate', '0')) * 100
          branch_rate = float(root.attrib.get('branch-rate', '0')) * 100

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"report={report}\n")
              handle.write(f"line_rate={line_rate:.2f}\n")
              handle.write(f"branch_rate={branch_rate:.2f}\n")
          PY

      - name: Testartefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-testresults
          path: TestResults/ci
          if-no-files-found: error

      # CycloneDX.dotnet liest die bereits per `dotnet restore` aufgeloesten Pakete aus den
      # project.assets.json (--disable-package-restore); kein erneuter Netzwerkzugriff noetig.
      - name: CycloneDX-SBOM fuer die .NET-Solution erzeugen
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX core-engine.sln \
            --disable-package-restore \
            --output ./sbom \
            --filename sbom-flowzer-dotnet.cdx.json \
            --output-format Json

      - name: .NET-SBOM hochladen
        uses: actions/upload-artifact@v4
        with:
          name: sbom-dotnet
          path: sbom/sbom-flowzer-dotnet.cdx.json
          if-no-files-found: error

      - name: CI-Zusammenfassung schreiben
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## .NET-Validierung

          - Restore und Build laufen auf GitHub Actions reproduzierbar.
          - Zusätzlich laufen die Web-API-Tests und die DMN-Tests im selben Job mit.
          - Die Core-Engine-Tests laufen jetzt wieder vollständig ohne Quarantänefilter im CI-Pfad.
          - Coverage (Cobertura): **${{ steps.coverage.outputs.line_rate }} %** Line Rate / **${{ steps.coverage.outputs.branch_rate }} %** Branch Rate
          - Coverage-Report: `${{ steps.coverage.outputs.report }}`
          EOF

  console:
    name: Build und Tests der React-Konsole
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src/FlowzerConsole/package-lock.json
            packages/flowzer-sdk/package-lock.json
            packages/flowzer-react/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: src/FlowzerConsole
        run: npm ci

      - name: Typen pruefen
        working-directory: src/FlowzerConsole
        run: npm run typecheck

      - name: Linter
        working-directory: src/FlowzerConsole
        run: npm run lint

      - name: Tests
        working-directory: src/FlowzerConsole
        run: npm run test

      - name: Bauen
        working-directory: src/FlowzerConsole
        run: npm run build

      - name: Sichere Runtime- und Coolify-Konfiguration prüfen
        run: node --test tests/ui-smoke/runtime-config.test.mjs

      # Eine API-Route, die das Gateway der Konsole nicht weiterleitet, beantwortet die
      # Konsole mit ihrer eigenen Startseite: Der Aufruf bekommt 200 und niemals die
      # erwartete Antwort. Genau so ist /job zuerst durchgerutscht.
      - name: Weiterleitungsliste des Gateways pruefen
        run: ./tests/ui-smoke/check-gateway-routes.sh

      # Ohne Cache-Anweisung auf index.html sahen Anwender nach einem Release weiter die alte
      # Oberflaeche. Die Pruefung startet den Entrypoint im echten nginx-Basisimage.
      - name: Cache- und Sicherheitskopfzeilen der Konsole pruefen
        run: ./tests/ui-smoke/check-console-headers.sh

      - name: Bekannte Schwachstellen der Abhaengigkeiten pruefen
        working-directory: src/FlowzerConsole
        run: npm audit --audit-level=high

      - name: CycloneDX-SBOM fuer die Konsole erzeugen
        working-directory: src/FlowzerConsole
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON --output-file sbom-flowzer-console.cdx.json

      - name: Konsolen-SBOM hochladen
        uses: actions/upload-artifact@v4
        with:
          name: sbom-console
          path: src/FlowzerConsole/sbom-flowzer-console.cdx.json
          if-no-files-found: error

  typescript_sdk:
    name: Headless SDK und React-Bausteine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/flowzer-sdk/package-lock.json
            packages/flowzer-react/package-lock.json
            examples/react-host-embedding/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: packages/flowzer-sdk
        run: npm ci

      - name: OpenAPI-Typen neu erzeugen und Drift ausschließen
        working-directory: packages/flowzer-sdk
        run: |
          npm run generate:openapi
          git diff --exit-code -- src/schema.generated.ts

      - name: SDK prüfen und bauen
        working-directory: packages/flowzer-sdk
        run: npm run check

      - name: Veröffentlichbares Paket prüfen
        working-directory: packages/flowzer-sdk
        run: npm pack --dry-run

      - name: Bekannte Schwachstellen der Abhängigkeiten prüfen
        working-directory: packages/flowzer-sdk
        run: npm audit --audit-level=high

      - name: React-Abhängigkeiten installieren
        working-directory: packages/flowzer-react
        run: npm ci

      - name: React-Bausteine prüfen und bauen
        working-directory: packages/flowzer-react
        run: npm run check

      - name: Veröffentlichbares React-Paket prüfen
        working-directory: packages/flowzer-react
        run: npm pack --dry-run

      - name: React-Abhängigkeiten auf bekannte Schwachstellen prüfen
        working-directory: packages/flowzer-react
        run: npm audit --audit-level=high

      - name: Unabhängige Hostfixture installieren und prüfen
        working-directory: examples/react-host-embedding
        run: |
          npm ci
          npm run typecheck
          npm audit --audit-level=high

  console_smoke:
    name: UI-Smoke-Tests der Konsole
    runs-on: ubuntu-latest
    needs:
      - dotnet
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET-SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tests/ui-smoke/package-lock.json
            src/FlowzerConsole/package-lock.json
            packages/flowzer-sdk/package-lock.json
            packages/flowzer-react/package-lock.json

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore core-engine.sln

      - name: Solution bauen
        run: dotnet build core-engine.sln --no-restore --configuration Release

      - name: Abhaengigkeiten der Konsole installieren
        working-directory: src/FlowzerConsole
        run: npm ci

      # Die lokalen file:-Pakete veröffentlichen ausschließlich ihre gebauten dist-Einstiege.
      # Ein frischer Runner besitzt diese Artefakte noch nicht; ohne den expliziten Build
      # wartet Playwright nur auf einen Vite-Server, der die Pakete niemals auflösen kann.
      - name: Oeffentliche Flowzer-Pakete fuer die Konsole bauen
        working-directory: src/FlowzerConsole
        run: npm run prepare:flowzer-packages

      - name: Playwright-Abhängigkeiten installieren
        working-directory: tests/ui-smoke
        run: npm ci

      - name: Chromium für Playwright installieren
        working-directory: tests/ui-smoke
        timeout-minutes: 10
        run: npm run install:browsers

      - name: UI-Smoke-Tests ausführen
        working-directory: tests/ui-smoke
        timeout-minutes: 15
        run: npm test

      - name: Produktionsbundle der Konsole bauen
        working-directory: src/FlowzerConsole
        run: npm run build

      - name: BFF-Sitzung gegen das Produktionsbundle prüfen
        working-directory: tests/ui-smoke
        run: npm run test:production

      - name: Playwright-Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-report
          path: |
            tests/ui-smoke/playwright-report
            tests/ui-smoke/test-results
            tests/ui-smoke/playwright-report-production
            tests/ui-smoke/test-results-production
          if-no-files-found: ignore

      - name: CI-Zusammenfassung schreiben
        if: always()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## UI-Smoke-Tests

          - Playwright prüft die Kernrouten `/`, `/workflows`, `/instances`, `/forms` und `/tasks` der Konsole.
          - Web-API und Konsole werden im Testjob reproduzierbar lokal gestartet.
          - Der Modeler wird mit geöffnetem Diagramm geprüft — eine leere Zeichenfläche fällt damit auf.
          EOF

  third_party_notices:
    name: Abhängigkeits-/Lizenzhinweise auf Drift pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET-SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src/FlowzerConsole/package-lock.json
            packages/flowzer-sdk/package-lock.json
            packages/flowzer-react/package-lock.json

      # generate-third-party-notices.py liest Lizenzen aus dem lokalen NuGet-Cache und aus
      # node_modules; beides muss vorher aufgeloest sein.
      - name: .NET-Abhängigkeiten wiederherstellen
        run: dotnet restore core-engine.sln

      - name: Konsolen-Abhaengigkeiten installieren
        working-directory: src/FlowzerConsole
        run: npm ci

      - name: SDK-Abhaengigkeiten installieren
        working-directory: packages/flowzer-sdk
        run: npm ci

      - name: React-Bausteine-Abhaengigkeiten installieren
        working-directory: packages/flowzer-react
        run: npm ci

      - name: THIRD-PARTY-NOTICES.md neu erzeugen und Drift ausschließen
        run: |
          python3 scripts/ci/generate-third-party-notices.py
          git diff --exit-code -- THIRD-PARTY-NOTICES.md

  # Installations- und Auth-Abnahme gegen einen isolierten Keycloak (R1b, Issue #256). Baut API
  # und Konsole aus dem Repository, startet sie mit eigener Test-CA und prueft Golden Path und
  # Negativfaelle. Nicht als Pflicht-Check in der Branch-Protection eingetragen; ein roter Lauf
  # faerbt aber den Workflow rot. Bei Fehler, Abbruch oder Timeout liegen Logs und Report als
  # Artefakt bereit.
  installation_auth:
    name: Installations- und Auth-Abnahme (isolierter Keycloak)
    runs-on: ubuntu-latest
    needs:
      - dotnet
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/installation-auth/package-lock.json

      - name: Playwright-Abhaengigkeiten installieren
        working-directory: tests/installation-auth
        run: npm ci

      - name: Chromium fuer Playwright installieren
        working-directory: tests/installation-auth
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      # Eigenes Schritt-Timeout unter dem Job-Timeout: So erreicht der Abbruch run.sh noch
      # rechtzeitig, dessen EXIT-Falle Logs sammelt und den Stack abraeumt. `exec`, weil der
      # Runner bei Abbruch oder Timeout nur seinem direkten Kindprozess das Signal schickt.
      - name: Abnahme ausfuehren
        timeout-minutes: 25
        env:
          PLAYWRIGHT_SKIP_BROWSER_INSTALL: '1'
        run: exec tests/installation-auth/run.sh

      - name: Logs und Playwright-Report hochladen
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: installation-auth-report
          path: |
            tests/installation-auth/logs
            tests/installation-auth/playwright-report
            tests/installation-auth/test-results
          if-no-files-found: ignore
