name: Release

# Produktion (flowzer.maass.it): baut die Images aus dem Branch `release` und rollt sie ueber
# Coolify aus. Beide Schritte liegen in wiederverwendbaren Workflows, damit Staging exakt
# denselben Weg nimmt. Deploy-Zugangsdaten liegen im GitHub-Environment `maassit-production`.

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: images
    # Produktion folgt ausschliesslich release; Tags und manuelle Laeufe anderer Branches bauen nur Images.
    if: github.ref == 'refs/heads/release'
    uses: ./.github/workflows/coolify-deploy.yml
    with:
      environment: maassit-production
      concurrency_group: coolify-flowzer-maass-it
      image_tag: ${{ needs.images.outputs.image_tag }}
    secrets: inherit
