name: Images

# Baut die Container-Images fuer API und Konsole und veroeffentlicht sie in der GitHub
# Container Registry. Wird von `release.yml` (Branch release) und `staging.yml` (Branch main)
# aufgerufen, damit beide Wege exakt dasselbe Image aus derselben Revision bekommen.

on:
  workflow_call:
    inputs:
      publish_latest:
        description: Zusaetzlich als `latest` veroeffentlichen (nur fuer main).
        type: boolean
        default: false
    outputs:
      image_tag:
        description: Der gebaute Tag, Form `sha-<12 Zeichen>`.
        value: ${{ jobs.images.outputs.image_tag }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/flowzer-api
  IMAGE_CONSOLE: ghcr.io/${{ github.repository_owner }}/flowzer-console

jobs:
  images:
    name: Images bauen und veroeffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Image-Tag bestimmen
        id: meta
        run: |
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "image_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          # `latest` folgt ausschliesslich main; Release-Tags bekommen zusaetzlich ihren Tagnamen.
          extra_api=""; extra_console=""
          if [ "${{ inputs.publish_latest }}" = "true" ]; then
            extra_api="$IMAGE_API:latest"; extra_console="$IMAGE_CONSOLE:latest"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            extra_api="$IMAGE_API:${GITHUB_REF#refs/tags/}"; extra_console="$IMAGE_CONSOLE:${GITHUB_REF#refs/tags/}"
          fi
          echo "extra_api=$extra_api" >> "$GITHUB_OUTPUT"
          echo "extra_console=$extra_console" >> "$GITHUB_OUTPUT"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API-Image bauen und pushen
        id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.extra_api }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Syft (anchore/sbom-action) liest bereits das gepushte, digest-referenzierte Image ueber
      # die Docker-Anmeldung von oben aus GHCR - keine zusaetzlichen Secrets noetig. Die Variante
      # ueber `docker/build-push-action`-eigene `sbom: true`/`provenance: true`-Inputs wuerde die
      # SBOM stattdessen nur als Registry-Attestation an das Image haengen, nicht als eigenstaendige,
      # herunterladbare Datei - hier ist aber ein Release-Artefakt zum Herunterladen gefordert.
      - name: SBOM fuer das API-Image erzeugen
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_API }}@${{ steps.build_api.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-flowzer-api-${{ steps.meta.outputs.image_tag }}.cdx.json
          artifact-name: sbom-flowzer-api-${{ steps.meta.outputs.image_tag }}.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Konsolen-Image bauen und pushen
        id: build_console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.console
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_CONSOLE }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.extra_console }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,scope=console,mode=max

      - name: SBOM fuer das Konsolen-Image erzeugen
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_CONSOLE }}@${{ steps.build_console.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-flowzer-console-${{ steps.meta.outputs.image_tag }}.cdx.json
          artifact-name: sbom-flowzer-console-${{ steps.meta.outputs.image_tag }}.cdx.json
          upload-artifact: true
          upload-release-assets: false
