name: Images

# Baut die Container-Images fuer API und Konsole und veroeffentlicht sie in der GitHub
# Container Registry. Wird von `release.yml` (Branch release) und `staging.yml` (Branch main)
# aufgerufen, damit beide Wege exakt dasselbe Image aus derselben Revision bekommen.
#
# Gebaut wird fuer amd64 und arm64, jede Architektur auf einem Laeufer ihrer eigenen Art:
# Produktion laeuft auf amd64, Staging auf einem ARM-Server. Emulation waere fuer den
# .NET- und den Node-Build unzumutbar langsam, native Laeufer sind fuer oeffentliche
# Repositories kostenlos. Die beiden Teilbilder werden danach zu einem Manifest vereint,
# sodass jeder Server unter demselben Tag sein passendes Image zieht.
#
# Tags: Jedes Manifest heisst `sha-<12 Zeichen>`. Zusaetzliche Tags zeigen auf dasselbe
# Manifest: `latest` fuer main (`publish_latest`), der Tagname bei v*-Tags und die vom
# Aufrufer in `extra_tags` genannten mitlaufenden Tags. `release.yml` setzt dort `prod-next`,
# das ein Timer auf dem Produktionshost vorab zieht, damit Coolify beim Deploy keine Layer
# mehr laden muss (#367).

on:
  workflow_call:
    inputs:
      publish_latest:
        description: Zusaetzlich als `latest` veroeffentlichen (nur fuer main).
        type: boolean
        default: false
      extra_tags:
        description: >-
          Weitere mitlaufende Tags, durch Leerzeichen getrennt, die auf dasselbe Manifest wie
          `sha-<12 Zeichen>` zeigen (Produktion: `prod-next` fuer den Vorab-Pull, #367).
          Leer laesst das bisherige Verhalten unveraendert.
        type: string
        default: ''
    outputs:
      image_tag:
        description: Der gebaute Tag, Form `sha-<12 Zeichen>`.
        value: ${{ jobs.tag.outputs.image_tag }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/flowzer-api
  IMAGE_CONSOLE: ghcr.io/${{ github.repository_owner }}/flowzer-console

jobs:
  tag:
    name: Image-Tag bestimmen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      extra_tags: ${{ steps.meta.outputs.extra_tags }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Tags ableiten
        id: meta
        env:
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          EXTRA_TAGS: ${{ inputs.extra_tags }}
        run: |
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "image_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          # `latest` folgt ausschliesslich main; Versions-Tags (v*) bekommen zusaetzlich ihren
          # Tagnamen. Andere Git-Tags erzeugen kein Registry-Tag, damit ein manueller Lauf auf
          # einen beliebigen Git-Tag weder `latest`, `prod-next` noch fremde `sha-`-Tags umhaengt.
          extra_tags=""
          if [ "$PUBLISH_LATEST" = "true" ]; then
            extra_tags="latest"
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            version_tag="${GITHUB_REF#refs/tags/}"
            if ! printf '%s\n' "$version_tag" | grep -Eqx 'v[0-9][A-Za-z0-9_.-]{0,126}'; then
              echo "Versions-Tag ist kein gueltiger Image-Tag: $version_tag" >&2
              exit 2
            fi
            extra_tags="$version_tag"
          fi
          # Mitlaufende Tags des Aufrufers: nur die ausdruecklich erlaubten beweglichen Tags
          # (Positivliste), damit ein Aufrufer weder `latest` noch Versions- oder `sha-`-Tags
          # auf ein anderes Manifest umhaengen kann. Jeder Tag nur einmal; ohne Globbing, damit
          # ein `*` nicht zu Dateinamen des Checkouts wird.
          allowed_extra_tags=" prod-next prod-prev "
          set -f
          for tag in $EXTRA_TAGS; do
            case "$allowed_extra_tags" in
              *" $tag "*) ;;
              *) echo "Zusaetzlicher Tag nicht erlaubt (erlaubt:${allowed_extra_tags}): $tag" >&2; exit 2 ;;
            esac
            case " $extra_tags " in
              *" $tag "*) ;;
              *) extra_tags="${extra_tags:+$extra_tags }$tag" ;;
            esac
          done
          set +f
          echo "extra_tags=$extra_tags" >> "$GITHUB_OUTPUT"
          echo "Image-Tag sha-${short_sha}, zusaetzliche Tags: ${extra_tags:-keine}"

  build:
    name: ${{ matrix.image }} auf ${{ matrix.platform }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [api, console]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ohne Tag gepusht: Jede Architektur landet als eigener Digest, den der Merge-Job
      # anschliessend unter dem gemeinsamen Tag zusammenfasst.
      - name: Image bauen und als Digest pushen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/flowzer-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      # Der Digest steht im Dateiinhalt, nicht im Namen: Ein Doppelpunkt im Dateinamen
      # ueberlebt den Artefakt-Transport nicht zuverlaessig.
      - name: Digest festhalten
        run: |
          mkdir -p /tmp/digests
          printf '%s\n' "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image }}-${{ matrix.arch }}"

      - name: Digest weiterreichen
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Manifest fuer ${{ matrix.image }} veroeffentlichen
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        image: [api, console]
    steps:
      - name: Digests holen
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Architekturen unter einem Tag vereinen
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/flowzer-${{ matrix.image }}
          IMAGE_TAG: ${{ needs.tag.outputs.image_tag }}
          EXTRA_TAGS: ${{ needs.tag.outputs.extra_tags }}
        run: |
          digests=""
          for file in /tmp/digests/*; do
            digests="$digests $IMAGE@$(cat "$file")"
          done
          test -n "$digests" || { echo "Keine Digests gefunden." >&2; exit 1; }
          # Ein Aufruf, ein Manifest: Alle Tags zeigen danach auf denselben Digest.
          tags="--tag $IMAGE:$IMAGE_TAG"
          for extra_tag in $EXTRA_TAGS; do
            tags="$tags --tag $IMAGE:$extra_tag"
          done
          echo "Veroeffentliche $IMAGE unter: $IMAGE_TAG${EXTRA_TAGS:+ $EXTRA_TAGS}"
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $digests
          docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | .platform.os + "/" + .platform.architecture' | sort -u

      # Syft liest das fertige, digest-referenzierte Manifest ueber die Docker-Anmeldung von
      # oben aus GHCR - keine zusaetzlichen Secrets noetig. Die Variante ueber die
      # `sbom: true`-Eingabe von `docker/build-push-action` haengt die SBOM nur als
      # Registry-Attestation an das Image, nicht als herunterladbare Datei - hier ist aber ein
      # Release-Artefakt zum Herunterladen gefordert.
      - name: SBOM erzeugen
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/flowzer-${{ matrix.image }}:${{ needs.tag.outputs.image_tag }}
          format: cyclonedx-json
          output-file: sbom-flowzer-${{ matrix.image }}-${{ needs.tag.outputs.image_tag }}.cdx.json
          artifact-name: sbom-flowzer-${{ matrix.image }}-${{ needs.tag.outputs.image_tag }}.cdx.json
          upload-artifact: true
          upload-release-assets: false
