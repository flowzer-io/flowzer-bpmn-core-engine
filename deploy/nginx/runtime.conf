# Gateway des lokalen Laufzeitstapels (compose.runtime.yml).
#
# Die Aufteilung zwischen Oberflaeche und API macht der Konsolen-Container selbst — sein
# nginx kennt die API-Routen und leitet sie an den API-Container weiter. Hier steht
# deshalb nur noch eine Weiterleitung; eine zweite Routenliste an dieser Stelle koennte
# von der des Containers abweichen und dann ein anderes Verhalten zeigen als Produktion.
events {}

http {
  # Ein vorgeschalteter TLS-Terminator liefert das externe Schema. Fehlt der Header
  # beim direkten lokalen Aufruf, bleibt das von diesem Gateway beobachtete Schema
  # massgeblich. Der vorgelagerte Proxy muss eingehende Client-Header ersetzen.
  map $http_x_forwarded_proto $flowzer_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
  }

  upstream flowzer_console {
    server console:8080;
  }

  server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    # $http_host behaelt einen expliziten Port. Das ist fuer den Origin-Vergleich des
    # BFF erforderlich, wenn die Installation nicht auf 443 erreichbar ist.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $flowzer_forwarded_proto;
    client_max_body_size 8m;

    location / {
      proxy_pass http://flowzer_console;
    }
  }
}
