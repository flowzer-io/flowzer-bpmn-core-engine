services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      FLOWZER_STORAGE_ROOT: /data/flowzer-storage
      # Authentifizierung: None (Default) oder JwtBearer mit Authority und Audience des Identity Providers.
      Authentication__Scheme: ${FLOWZER_AUTH_SCHEME:-None}
      Authentication__JwtBearer__Authority: ${FLOWZER_AUTH_AUTHORITY:-}
      Authentication__JwtBearer__Audience: ${FLOWZER_AUTH_AUDIENCE:-}
      Authentication__JwtBearer__RequireHttpsMetadata: ${FLOWZER_AUTH_REQUIRE_HTTPS_METADATA:-true}
    volumes:
      - ./.data/runtime-storage:/data/flowzer-storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  console:
    build:
      context: .
      dockerfile: Dockerfile.console
    environment:
      FLOWZER_API_UPSTREAM: api:8080
      FLOWZER_API_BASE_URL: /
      FLOWZER_ACCENT: ${FLOWZER_ACCENT:-iris}
      # Diese Werte sind Pflicht: Das ausgelieferte Buendel ist ein Produktionsbuendel und
      # zeigt ohne Identity Provider nur die Anmeldeseite. Der technische Benutzer greift
      # ausschliesslich im Entwicklungsserver (npm run dev), nicht hier.
      FLOWZER_OIDC_AUTHORITY: ${FLOWZER_OIDC_AUTHORITY:-}
      FLOWZER_OIDC_CLIENT_ID: ${FLOWZER_OIDC_CLIENT_ID:-}
      FLOWZER_OIDC_AUDIENCE: ${FLOWZER_AUTH_AUDIENCE:-}
      FLOWZER_OIDC_SCOPES: ${FLOWZER_OIDC_SCOPES:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/config.json >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_healthy
    ports:
      - "${FLOWZER_RUNTIME_PORT:-5288}:8080"
    volumes:
      - ./deploy/nginx/runtime.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
