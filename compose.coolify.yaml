# Produktions-Stack fuer Coolify (Projekt MIT Tools, Server cool4). Die Images kommen aus der
# GitHub Container Registry; der Release-Workflow pinnt FLOWZER_IMAGE_TAG auf die Revision und
# loest das Deployment aus. Geheime Werte liegen ausschliesslich als Coolify-Secrets vor.
# Coolify ergänzt eine gemeinsame env_file und ersetzt leere environment-Werte durch
# gespeicherte Werte. Deshalb nicht leere, eindeutig nicht geheime Platzhalter verwenden.
# Der Parser injiziert referenzierte Aliase zusätzlich nur im jeweiligen Dienst; dort
# sind sie bereits für die explizite Konfigurationszuordnung erforderlich. Fremde Aliase
# bleiben maskiert (z. B. Migrationszugang in API/Konsole, BFF-Zugang in migrate/Konsole).
# Neue Secret-Aliase auch im Compose-Isolationstest aufnehmen und am Zielsystem prüfen.
x-flowzer-secret-isolation: &flowzer-secret-isolation
  STORAGE_CONNECTION_STRING: "__FLOWZER_NOT_FOR_THIS_SERVICE__"
  STORAGE_MIGRATION_CONNECTION_STRING: "__FLOWZER_NOT_FOR_THIS_SERVICE__"
  FLOWZER_BFF_CLIENT_SECRET: "__FLOWZER_NOT_FOR_THIS_SERVICE__"
  FLOWZER_DIRECTORY_CLIENT_SECRET: "__FLOWZER_NOT_FOR_THIS_SERVICE__"

services:
  migrate:
    image: ghcr.io/flowzer-io/flowzer-api:${FLOWZER_IMAGE_TAG:-latest}
    restart: "no"
    exclude_from_hc: true
    command: ["--migrate"]
    environment:
      <<: *flowzer-secret-isolation
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Provider: PostgreSql
      Storage__PostgreSql__ConnectionString: "${STORAGE_MIGRATION_CONNECTION_STRING:?STORAGE_MIGRATION_CONNECTION_STRING muss gesetzt sein}"
      Storage__PostgreSql__MigrationConnectionString: "${STORAGE_MIGRATION_CONNECTION_STRING}"
      Storage__PostgreSql__Schema: "${STORAGE_SCHEMA:-flowzer}"

  api:
    image: ghcr.io/flowzer-io/flowzer-api:${FLOWZER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - 8080
    environment:
      <<: *flowzer-secret-isolation
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Storage__Provider: PostgreSql
      Storage__PostgreSql__ConnectionString: "${STORAGE_CONNECTION_STRING:?STORAGE_CONNECTION_STRING muss gesetzt sein}"
      Storage__PostgreSql__Schema: "${STORAGE_SCHEMA:-flowzer}"
      Authentication__Scheme: "${FLOWZER_AUTH_SCHEME:-Bff}"
      Authentication__JwtBearer__Authority: "${FLOWZER_AUTH_AUTHORITY:?FLOWZER_AUTH_AUTHORITY muss gesetzt sein}"
      Authentication__JwtBearer__Audience: "${FLOWZER_AUTH_AUDIENCE:?FLOWZER_AUTH_AUDIENCE muss gesetzt sein}"
      Authentication__JwtBearer__RequireHttpsMetadata: "${FLOWZER_AUTH_REQUIRE_HTTPS_METADATA:-true}"
      Authentication__JwtBearer__RequiredRole: "${FLOWZER_AUTH_REQUIRED_ROLE:-flowzer-access}"
      Authentication__JwtBearer__Roles__Modeler: "${FLOWZER_AUTH_ROLE_MODELER:-flowzer-modeler}"
      Authentication__JwtBearer__Roles__Operator: "${FLOWZER_AUTH_ROLE_OPERATOR:-flowzer-operator}"
      Authentication__JwtBearer__Roles__Worker: "${FLOWZER_AUTH_ROLE_WORKER:-flowzer-worker}"
      Authentication__JwtBearer__Roles__AiConnectionUser: "${FLOWZER_AUTH_ROLE_AI_CONNECTION_USER:-flowzer-ai-connection-user}"
      Authentication__JwtBearer__Roles__AiConnectionManager: "${FLOWZER_AUTH_ROLE_AI_CONNECTION_MANAGER:-flowzer-ai-connection-manager}"
      # Getrennte Opt-ins für erlaubten Datenfluss und tatsächliche Ausführung.
      Ai__AllowCloudProviders: "${FLOWZER_AI_ALLOW_CLOUD_PROVIDERS:-false}"
      Ai__AllowLocalEndpoints: "${FLOWZER_AI_ALLOW_LOCAL_ENDPOINTS:-false}"
      Ai__SecretEnvironmentVariablePrefix: FLOWZER_AI_
      AiExecution__Enabled: "${FLOWZER_AI_EXECUTION_ENABLED:-false}"
      # Der vertrauliche Client-Schluessel ist ein Coolify-Secret und wird ausnahmslos
      # im API-Container verwendet. Der Konsolen-Container erhaelt ihn nicht.
      # Leere Werte bleiben nur fuer den expliziten JwtBearer-Modus erlaubt. Im BFF-Modus
      # beendet die API den Start mit einer eindeutigen Validierungsmeldung.
      Authentication__Bff__ClientId: "${FLOWZER_BFF_CLIENT_ID:-}"
      Authentication__Bff__ClientSecret: "${FLOWZER_BFF_CLIENT_SECRET:-}"
      Authentication__Bff__Scopes__0: "${FLOWZER_BFF_SCOPE_0:-}"
      Authentication__Bff__Scopes__1: "${FLOWZER_BFF_SCOPE_1:-}"
      Authentication__Bff__Scopes__2: "${FLOWZER_BFF_SCOPE_2:-}"
      Authentication__Bff__DataProtectionKeysPath: /var/lib/flowzer/data-protection
      # Read-only Service-Account; ClientSecret ist ein Coolify-Secret und gelangt
      # weder in die Konsole noch in Statusantworten oder Prozesspakete.
      IdentityDirectory__Enabled: "${FLOWZER_DIRECTORY_ENABLED:-false}"
      IdentityDirectory__ServerUrl: "${FLOWZER_DIRECTORY_SERVER_URL:-}"
      IdentityDirectory__Issuer: "${FLOWZER_DIRECTORY_ISSUER:-}"
      IdentityDirectory__Realm: "${FLOWZER_DIRECTORY_REALM:-}"
      IdentityDirectory__ClientId: "${FLOWZER_DIRECTORY_CLIENT_ID:-}"
      IdentityDirectory__ClientSecret: "${FLOWZER_DIRECTORY_CLIENT_SECRET:-}"
      IdentityDirectory__SyncIntervalSeconds: "${FLOWZER_DIRECTORY_SYNC_INTERVAL_SECONDS:-300}"
      # Das Gateway laeuft im selben Docker-Netz; nur von dort wird der Weiterleitungsheader
      # geglaubt. Ohne diese Angabe zaehlt jedes anonyme Kontingent gegen die Proxy-Adresse.
      ForwardedHeaders__KnownNetworks__0: "${FLOWZER_TRUSTED_PROXY_NETWORK:-172.16.0.0/12}"
      # Coolify-Proxy und Konsolen-nginx bilden zwei Stufen; drei erlaubt zusaetzlich
      # ein installationsspezifisches Gateway, jedoch nur innerhalb des Netzes oben.
      ForwardedHeaders__ForwardLimit: "${FLOWZER_FORWARDED_HEADER_LIMIT:-3}"
      # Ohne freigegebene Zieladresse nimmt die Engine keine Webhook-Anmeldung an.
      ServiceTaskWebhooks__Enabled: "${FLOWZER_WEBHOOKS_ENABLED:-true}"
      ServiceTaskWebhooks__AllowedHosts__0: "${FLOWZER_WEBHOOK_ALLOWED_HOST:-}"
      RateLimiting__Enabled: "${FLOWZER_RATE_LIMIT_ENABLED:-true}"
      RateLimiting__PermitLimit: "${FLOWZER_RATE_LIMIT_PERMITS:-300}"
      RateLimiting__WindowSeconds: "${FLOWZER_RATE_LIMIT_WINDOW_SECONDS:-60}"
      Limits__MaxUploadBytes: "${FLOWZER_MAX_UPLOAD_BYTES:-8388608}"
      TimerScheduler__Enabled: "true"
      TimerScheduler__PollIntervalSeconds: "${FLOWZER_TIMER_POLL_SECONDS:-5}"
      TZ: Europe/Berlin
    volumes:
      # Persistiert Data-Protection-Schluessel fuer Session, OIDC-Korrelation und CSRF
      # ueber Redeploys. Nicht mit Storage oder dem Konsolen-Container teilen.
      - flowzer-bff-data-protection:/var/lib/flowzer/data-protection
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Die Oberflaeche liefert nur statische Assets und nicht geheime Laufzeitwerte. Ihr nginx
  # leitet die API-Pfade an den API-Container weiter, sodass Browser und API denselben Ursprung teilen.
  console:
    image: ghcr.io/flowzer-io/flowzer-console:${FLOWZER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - 8080
    environment:
      <<: *flowzer-secret-isolation
      FLOWZER_API_UPSTREAM: api:8080
      FLOWZER_API_BASE_URL: /
      FLOWZER_BFF_ENABLED: "true"
      # Akzentfarbe fuer das Erscheinungsbild des Unternehmens: iris, teal, emerald,
      # amber oder rose. Gilt fuer alle; es gibt keine persoenliche Einstellung dafuer.
      FLOWZER_ACCENT: "${FLOWZER_ACCENT:-iris}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  flowzer-bff-data-protection:
